[project]
name = "ai-werewolf"
version = "0.1.0"
description = "AI 狼人杀 · 人类幕后智囊团"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.127,<0.128",
    "uvicorn[standard]>=0.38,<0.39",
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP045"]
